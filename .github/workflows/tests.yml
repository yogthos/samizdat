name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Building jolt from source needs Chez and a C toolchain; the release
      # binary is self-contained, so the install script is the cheap path.
      - name: Install jolt
        # raw.githubusercontent rate-limits ANONYMOUS Actions runners and answers
        # 403, which bit us repeatedly. Fetch through the GitHub API with the
        # runner's own GITHUB_TOKEN first: authenticated requests have a far
        # higher rate limit and do not 403. Fall back to raw with curl's own
        # retry. Either way the installer is written to a file first, so a
        # rate-limit HTML page can never be fed to bash as the installer.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fetch() {
            # 1) authenticated API (raw content), highest rate limit
            curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              https://api.github.com/repos/jolt-lang/jolt/contents/install?ref=main \
              -o /tmp/jolt-install && test -s /tmp/jolt-install && return 0
            # 2) anonymous raw, with curl retry/backoff
            curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors \
              https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
              -o /tmp/jolt-install && test -s /tmp/jolt-install && return 0
            return 1
          }
          for i in 1 2 3 4 5; do
            fetch && break
            echo "installer fetch attempt $i failed; retrying in $((i * 8))s" >&2
            sleep $((i * 8))
          done
          test -s /tmp/jolt-install || { echo "could not fetch the jolt installer" >&2; exit 1; }
          # An API/rate-limit response is JSON/HTML, not a shell script; a real
          # installer starts with a shebang. Guard against running a stray page.
          head -1 /tmp/jolt-install | grep -q '^#!' \
            || { echo "fetched file is not a script:" >&2; head -3 /tmp/jolt-install >&2; exit 1; }
          bash /tmp/jolt-install --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache jolt gitlibs
        uses: actions/cache@v4
        with:
          path: ~/.jolt/gitlibs
          key: jolt-gitlibs-${{ hashFiles('deps.edn') }}

      - name: Fetch dependencies
        run: jolt -P

      - name: Test suite
        # Offline and deterministic: maestro, mycelium, the store, the task
        # board, the arbiter and gates, fence parsing, the prompt contract.
        # No provider calls.
        run: jolt -M:test


  cold-load:
    name: namespaces load on their own
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fast
    steps:
      - uses: actions/checkout@v4

      - name: Install jolt
        # raw.githubusercontent rate-limits ANONYMOUS Actions runners and answers
        # 403, which bit us repeatedly. Fetch through the GitHub API with the
        # runner's own GITHUB_TOKEN first: authenticated requests have a far
        # higher rate limit and do not 403. Fall back to raw with curl's own
        # retry. Either way the installer is written to a file first, so a
        # rate-limit HTML page can never be fed to bash as the installer.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fetch() {
            # 1) authenticated API (raw content), highest rate limit
            curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              https://api.github.com/repos/jolt-lang/jolt/contents/install?ref=main \
              -o /tmp/jolt-install && test -s /tmp/jolt-install && return 0
            # 2) anonymous raw, with curl retry/backoff
            curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors \
              https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
              -o /tmp/jolt-install && test -s /tmp/jolt-install && return 0
            return 1
          }
          for i in 1 2 3 4 5; do
            fetch && break
            echo "installer fetch attempt $i failed; retrying in $((i * 8))s" >&2
            sleep $((i * 8))
          done
          test -s /tmp/jolt-install || { echo "could not fetch the jolt installer" >&2; exit 1; }
          # An API/rate-limit response is JSON/HTML, not a shell script; a real
          # installer starts with a shebang. Guard against running a stray page.
          head -1 /tmp/jolt-install | grep -q '^#!' \
            || { echo "fetched file is not a script:" >&2; head -3 /tmp/jolt-install >&2; exit 1; }
          bash /tmp/jolt-install --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache jolt gitlibs
        uses: actions/cache@v4
        with:
          path: ~/.jolt/gitlibs
          key: jolt-gitlibs-${{ hashFiles('deps.edn') }}

      - name: Fetch dependencies
        run: jolt -P

      - name: Cold load
        # Every namespace that touches a shimmed library, loaded in its OWN
        # process. jolt resolves java.time.* only once jolt.time has installed
        # the host shim, so whether a path is safe depends on LOAD ORDER — and
        # the suite cannot see that, because it loads everything in one process
        # in one order. That is exactly how HEAD once shipped with the suite
        # dead at load. Three occurrences before this rung existed, each found
        # by a human hitting a wall (karamazov-kp7w).
        run: ./dev/cold-load.sh

  smoke:
    name: platform probes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fast
    steps:
      - uses: actions/checkout@v4

      - name: Install jolt
        # See the fast job for why: authenticated API fetch dodges the anonymous
        # raw.githubusercontent 403 rate limit, with a raw fallback and retries.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fetch() {
            curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              https://api.github.com/repos/jolt-lang/jolt/contents/install?ref=main \
              -o /tmp/jolt-install && test -s /tmp/jolt-install && return 0
            curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors \
              https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
              -o /tmp/jolt-install && test -s /tmp/jolt-install && return 0
            return 1
          }
          for i in 1 2 3 4 5; do
            fetch && break
            echo "installer fetch attempt $i failed; retrying in $((i * 8))s" >&2
            sleep $((i * 8))
          done
          test -s /tmp/jolt-install || { echo "could not fetch the jolt installer" >&2; exit 1; }
          head -1 /tmp/jolt-install | grep -q '^#!' \
            || { echo "fetched file is not a script:" >&2; head -3 /tmp/jolt-install >&2; exit 1; }
          bash /tmp/jolt-install --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache jolt gitlibs
        uses: actions/cache@v4
        with:
          path: ~/.jolt/gitlibs
          key: jolt-gitlibs-${{ hashFiles('deps.edn') }}

      - name: Probes
        # FTS5 through the FFI binding, serialized store access, HTTPS
        # surviving the nREPL load, and /health answering while a handler is
        # busy. The provider probes skip without a key rather than failing,
        # so a fork with no secret still gets a useful run.
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: jolt smoke

  build:
    name: standalone binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fast
    steps:
      - uses: actions/checkout@v4

      - name: Install jolt
        # See the fast job for why: authenticated API fetch dodges the anonymous
        # raw.githubusercontent 403 rate limit, with a raw fallback and retries.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fetch() {
            curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              https://api.github.com/repos/jolt-lang/jolt/contents/install?ref=main \
              -o /tmp/jolt-install && test -s /tmp/jolt-install && return 0
            curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors \
              https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
              -o /tmp/jolt-install && test -s /tmp/jolt-install && return 0
            return 1
          }
          for i in 1 2 3 4 5; do
            fetch && break
            echo "installer fetch attempt $i failed; retrying in $((i * 8))s" >&2
            sleep $((i * 8))
          done
          test -s /tmp/jolt-install || { echo "could not fetch the jolt installer" >&2; exit 1; }
          head -1 /tmp/jolt-install | grep -q '^#!' \
            || { echo "fetched file is not a script:" >&2; head -3 /tmp/jolt-install >&2; exit 1; }
          bash /tmp/jolt-install --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache jolt gitlibs
        uses: actions/cache@v4
        with:
          path: ~/.jolt/gitlibs
          key: jolt-gitlibs-${{ hashFiles('deps.edn') }}

      # `jolt build` embeds only what it can reach statically, so this job
      # guards against a dynamic require silently dropping a subtree from the
      # image — which happened once and only surfaced at startup.
      - name: Build
        run: jolt build -m samizdat.core -o samizdat

      # Two assertions. That it starts and serves, and that its TLS still works:
      # a built image used to resolve SSL_* to whatever the process linked rather
      # than the OpenSSL under :jolt/native, which faulted instead of erroring.
      # The boot-time provider warm-up drives a real handshake, and without a key
      # it fails on auth AFTER the handshake — so the thing to assert is the
      # absence of the fault, which needs no secret.
      - name: Binary starts and serves
        run: |
          HARNESS_PORT=3010 HARNESS_DB=ci.sqlite3 ./samizdat >boot.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3010/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3010/health | tee /dev/stderr | grep -q '"status":"ok"'
          cat boot.log
          ! grep -q 'invalid memory reference' boot.log
          grep -q 'nrepl  127.0.0.1' boot.log
